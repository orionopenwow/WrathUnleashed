# Leyline launcher (launcher/): test the Rust core on every change, and on a `launcher-v*` tag build the
# desktop app for Windows (.msi and setup .exe), macOS (.dmg, Apple Silicon and Intel) and Linux (.AppImage,
# .deb) and attach them to a GitHub release for that tag.
#
# Runs in the PUBLIC repo orionopenwow/Leyline (players can't download release files from the private
# WrathUnleashed repo, and a public repo's Actions minutes are free). Source copy: tools/github-workflows/ in
# WrathUnleashed; "Turn on GitHub builds.bat" puts it in Leyline's .github/workflows/ and pushes the tag. No secrets are needed: there is no code signing yet (owner decision, L0), so
# Windows SmartScreen and macOS Gatekeeper will warn on first run; the README says how to open it anyway.
name: leyline launcher
on:
  # No `paths` filter on push: with one, GitHub can skip tag pushes, and the tag is what makes a release.
  push:
    tags: ["launcher-v*"]
    branches: [main]
  pull_request:
    paths:
      - "launcher/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - name: cargo test (core, no webview)
        working-directory: launcher/src-tauri
        run: cargo test --no-default-features

  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    needs: core-tests
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - name: Install the Tauri CLI
        working-directory: launcher
        run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher
          tagName: ${{ github.ref_name }}
          releaseName: "Leyline ${{ github.ref_name }}"
          releaseBody: |
            Leyline desktop launcher. Pick your own installed client (3.3.5a or 1.12.1), install and manage Workshop mods,
            play on the official realm or a community Beacon, and host your own realm with the host kit.
            Builds are not code-signed yet: on Windows choose "More info, Run anyway"; on macOS right-click the app and choose Open.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
